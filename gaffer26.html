<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaffer '26 — World Cup Management Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1410;      /* floodlit pitch at night */
  --panel:#11221a;
  --panel2:#16301f;
  --line:#27482f;
  --chalk:#eaf4ec;      /* chalk lines */
  --chalk-dim:#9db8a4;
  --grass:#3fae6a;
  --gold:#e8b84b;       /* trophy */
  --red:#e0524a;
  --yellow:#e3c93f;
  --blue:#5aa7d6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--night);
  background-image:
    radial-gradient(1200px 600px at 50% -10%, rgba(63,174,106,.12), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 64px, transparent 64px 128px);
  color:var(--chalk);
  font-family:'Archivo',system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1060px;margin:0 auto;padding:18px 16px 80px}
h1,h2,h3,.disp{font-family:'Saira Condensed','Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer}
a{color:var(--grass)}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:18px;flex-wrap:wrap}
.mast h1{font-size:30px;font-weight:800;line-height:1}
.mast h1 .tick{color:var(--gold)}
.mast .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--chalk-dim);letter-spacing:.08em;text-transform:uppercase}

/* ---------- buttons ---------- */
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--chalk);padding:9px 16px;border-radius:6px;font-weight:600;font-size:14px;transition:background .15s,transform .1s}
.btn:hover{background:#1d3f29}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--grass);color:#06140b;border-color:var(--grass)}
.btn.primary:hover{background:#4cc77c}
.btn.gold{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}

/* ---------- team select ---------- */
.lede{max-width:62ch;color:var(--chalk-dim);margin-bottom:20px}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.gcard h3{font-size:15px;color:var(--gold);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:8px}
.team-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 8px;color:var(--chalk);font-size:14px;font-weight:500}
.team-row:hover{background:var(--panel2);border-color:var(--line)}
.team-row:focus-visible{outline:2px solid var(--gold)}
.team-row .flag{font-size:19px;width:24px}
.team-row .stars{margin-left:auto;font-size:10px;color:var(--gold);letter-spacing:1px;white-space:nowrap}

/* ---------- hub ---------- */
.hubhead{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;flex-wrap:wrap}
.hubhead .flag{font-size:40px}
.hubhead .tname{font-size:26px;font-weight:800;line-height:1}
.hubhead .meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--chalk-dim);margin-top:4px}
.hubhead .next{margin-left:auto;text-align:right}
.hubhead .next .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace}
.hubhead .next .fix{font-weight:700;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--chalk-dim);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px}
.tab.on{background:var(--chalk);color:#0b1410;border-color:var(--chalk)}
.tab:focus-visible{outline:2px solid var(--gold)}

/* ---------- panels / tables ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h3{font-size:16px;color:var(--gold);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid rgba(39,72,47,.45)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace}
tr.me td{background:rgba(63,174,106,.10)}
tr.qual td:first-child{box-shadow:inset 3px 0 0 var(--grass)}
.pos-G{color:var(--gold)} .pos-D{color:var(--blue)} .pos-M{color:var(--grass)} .pos-F{color:#f08f6a}
.cond-bar{display:inline-block;width:44px;height:6px;background:#0a120d;border-radius:3px;overflow:hidden;vertical-align:middle}
.cond-bar i{display:block;height:100%;background:var(--grass)}
.badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.badge.inj{background:#3a1714;color:#f1a09a}
.badge.sus{background:#3a3210;color:#ecd98a}
.badge.cap{background:#143a22;color:#9fe0b8}

/* ---------- pitch ---------- */
.tactics-wrap{display:grid;grid-template-columns:minmax(300px,1.15fr) 1fr;gap:14px}
@media(max-width:760px){.tactics-wrap{grid-template-columns:1fr}}
.pitch{position:relative;aspect-ratio:3/4;background:
  repeating-linear-gradient(0deg,#123620 0 12.5%,#0f2f1c 12.5% 25%);
  border:2px solid var(--chalk-dim);border-radius:8px;overflow:hidden}
.pitch::before,.pitch::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:1.5px solid rgba(234,244,236,.45)}
.pitch::before{top:-1px;width:46%;height:14%;border-top:none}
.pitch::after{bottom:-1px;width:46%;height:14%;border-bottom:none}
.pitch .half{position:absolute;top:50%;left:0;right:0;border-top:1.5px solid rgba(234,244,236,.45)}
.pitch .circle{position:absolute;top:50%;left:50%;width:26%;aspect-ratio:1;border:1.5px solid rgba(234,244,236,.45);border-radius:50%;transform:translate(-50%,-50%)}
.chip{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;background:transparent;border:none;color:var(--chalk);padding:0}
.chip .dot{width:38px;height:38px;margin:0 auto;border-radius:50%;background:var(--panel2);border:2px solid var(--chalk-dim);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;transition:border-color .15s, box-shadow .15s}
.chip .nm{font-size:10.5px;font-weight:600;margin-top:3px;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.sel .dot{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,184,75,.25)}
.chip.low .dot{border-color:var(--red)}
.chip:focus-visible .dot{outline:2px solid var(--gold)}
.bench-list{max-height:520px;overflow-y:auto}
.bench-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid rgba(39,72,47,.45);padding:7px 6px;color:var(--chalk);font-size:13px}
.bench-row:hover{background:var(--panel2)}
.bench-row.sel{background:rgba(232,184,75,.12);box-shadow:inset 3px 0 0 var(--gold)}
.bench-row .r{margin-left:auto;font-family:'IBM Plex Mono',monospace}
.selects{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:13px;font-weight:600}
select:focus-visible{outline:2px solid var(--gold)}

/* ---------- match ---------- */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.scoreboard .side{display:flex;align-items:center;gap:10px;min-width:0}
.scoreboard .side.away{justify-content:flex-end;text-align:right}
.scoreboard .side .flag{font-size:30px}
.scoreboard .side .nm{font-weight:800;font-size:18px;font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoreline{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;text-align:center;min-width:110px}
.clockrow{text-align:center;font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:13px;letter-spacing:.1em;margin-top:2px}
.momentum{height:7px;border-radius:4px;background:#0a120d;overflow:hidden;display:flex;margin:10px 0 4px}
.momentum .h{background:var(--grass);transition:width .5s}
.momentum .a{background:var(--red);transition:width .5s}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;height:300px;overflow-y:auto;font-size:13.5px}
.ev{padding:5px 6px;border-bottom:1px solid rgba(39,72,47,.4);display:flex;gap:9px;align-items:baseline}
.ev .min{font-family:'IBM Plex Mono',monospace;color:var(--chalk-dim);font-size:11.5px;min-width:32px}
.ev.goal{background:rgba(63,174,106,.12);border-left:3px solid var(--grass);font-weight:600}
.ev.goal-a{background:rgba(224,82,74,.10);border-left:3px solid var(--red);font-weight:600}
.ev.card .min{color:var(--yellow)}
.ev.redc .min{color:var(--red)}
.matchctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.othergames{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--chalk-dim);margin-top:10px;line-height:1.8}
.statgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-top:8px}
.statgrid .l{text-align:right}.statgrid .c{color:var(--chalk-dim);text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}

/* ---------- bracket ---------- */
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
.round{min-width:185px}
.round h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--chalk-dim);margin-bottom:8px}
.tie{background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-bottom:8px;font-size:12.5px;overflow:hidden}
.tie .tm{display:flex;gap:7px;padding:5px 8px;align-items:center}
.tie .tm+.tm{border-top:1px solid rgba(39,72,47,.5)}
.tie .tm.win{font-weight:700}
.tie .tm.lose{opacity:.45}
.tie .tm .sc{margin-left:auto;font-family:'IBM Plex Mono',monospace}
.tie.metie{border-color:var(--gold)}

/* ---------- misc ---------- */
.news-item{padding:8px 4px;border-bottom:1px solid rgba(39,72,47,.45);font-size:13.5px}
.news-item .d{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.bigmoment{text-align:center;padding:50px 20px}
.bigmoment .tr{font-size:74px;line-height:1}
.bigmoment h2{font-size:42px;color:var(--gold);margin:14px 0 6px}
.bigmoment p{color:var(--chalk-dim);max-width:54ch;margin:0 auto 18px}
.footnote{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--chalk-dim);margin-top:26px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.7}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:120px}
.kpi .v{font-family:'Saira Condensed';font-size:24px;font-weight:700;color:var(--gold)}
.kpi .k{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--chalk-dim)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media(max-width:560px){
  .scoreline{font-size:24px;min-width:80px}
  .hubhead .next{margin-left:0;text-align:left;width:100%}
}
</style>
</head>

const GROUPS={A:["MEX","RSA","KOR","CZE"],B:["CAN","BIH","QAT","SUI"],C:["BRA","MAR","HAI","SCO"],D:["USA","PAR","AUS","TUR"],E:["GER","CUW","CIV","ECU"],F:["NED","JPN","SWE","TUN"],G:["BEL","EGY","IRN","NZL"],H:["ESP","CPV","KSA","URU"],I:["FRA","SEN","IRQ","NOR"],J:["ARG","ALG","AUT","JOR"],K:["POR","COD","UZB","COL"],L:["ENG","CRO","GHA","PAN"]};

/* ---------------- ENGINE ---------------- */
const FORMATIONS={
 "4-3-3":{slots:["G","D","D","D","D","M","M","M","F","F","F"],xy:[[50,92],[15,74],[38,77],[62,77],[85,74],[28,53],[50,58],[72,53],[18,27],[50,20],[82,27]]},
 "4-2-3-1":{slots:["G","D","D","D","D","M","M","M","M","M","F"],xy:[[50,92],[15,74],[38,77],[62,77],[85,74],[38,62],[62,62],[20,42],[50,40],[80,42],[50,20]]},
 "4-4-2":{slots:["G","D","D","D","D","M","M","M","M","F","F"],xy:[[50,92],[15,74],[38,77],[62,77],[85,74],[14,50],[38,55],[62,55],[86,50],[38,24],[62,24]]},
 "3-5-2":{slots:["G","D","D","D","M","M","M","M","M","F","F"],xy:[[50,92],[28,78],[50,80],[72,78],[10,54],[32,56],[50,60],[68,56],[90,54],[38,24],[62,24]]},
 "5-3-2":{slots:["G","D","D","D","D","D","M","M","M","F","F"],xy:[[50,92],[10,68],[30,77],[50,79],[70,77],[90,68],[28,53],[50,58],[72,53],[38,24],[62,24]]}
};
const MENT={def:{nm:"Defensive",att:.78,con:.78},bal:{nm:"Balanced",att:1,con:1},atk:{nm:"Attacking",att:1.25,con:1.28}};
const STAGES=["GROUP 1","GROUP 2","GROUP 3","R32","R16","QF","SF","FINAL"];

let G=null; // game state

function newGame(teamId){
  const players={};
  for(const id in TEAMS) TEAMS[id].sq.forEach((p,i)=>{
    players[id+"_"+i]={id:id+"_"+i,team:id,n:p[0],pos:p[1],r:p[2],cond:100,goals:0,assists:0,yc:0,injured:0,banned:0,apps:0};
  });
  G={me:teamId,players,stage:0,alive:true,news:[],results:{},standings:initStandings(),
     formation:"4-3-3",mentality:"bal",xi:null,bracket:null,placed:null,champion:null,thirdMatch:null};
  G.xi=autoXI(teamId,G.formation);
  pushNews("Welcome to the dugout","You take charge of "+TEAMS[teamId].n+" for the 2026 World Cup. Group "+groupOf(teamId)+" awaits. Set your XI before matchday 1.");
}
function groupOf(id){for(const g in GROUPS) if(GROUPS[g].includes(id)) return g; return "?";}
function teamPlayers(id){return Object.values(G.players).filter(p=>p.team===id);}
function available(p){return !p.injured && !p.banned;}
function eff(p,slot){let v=p.r*(0.6+0.4*(p.cond/100)); if(slot && slot!==p.pos){v-= (slot==="G"||p.pos==="G")?25:6;} return v;}

function autoXI(id,form){
  const slots=FORMATIONS[form].slots, pool=teamPlayers(id).filter(available), used=new Set(), xi=[];
  for(const s of slots){
    let best=null,bv=-1;
    for(const p of pool){ if(used.has(p.id))continue; if(s==="G"&&p.pos!=="G")continue; if(s!=="G"&&p.pos==="G")continue;
      const v=eff(p,s)+(p.pos===s?4:0); if(v>bv){bv=v;best=p;} }
    if(best){used.add(best.id); xi.push(best.id);} else xi.push(null);
  }
  return xi;
}
function teamStrength(id,xiIds,ment){
  const f=ment||{att:1,con:1};
  let att=0,def=0,mid=0,gk=60,nO=0;
  const slots = xiIds.form?FORMATIONS[xiIds.form].slots:null;
  xiIds.ids.forEach((pid,i)=>{
    if(!pid)return; const p=G.players[pid]; const s=slots?slots[i]:p.pos; const v=eff(p,s);
    if(s==="G"){gk=v;return;} nO++;
    if(s==="D"){def+=v*1.0; mid+=v*0.25;}
    else if(s==="M"){mid+=v; att+=v*0.45; def+=v*0.45;}
    else {att+=v*1.1; mid+=v*0.2;}
  });
  const sc=nO?10/nO:1;
  return {att:(att*sc)*f.att, def:(def*sc+gk*0.9)/f.con, mid:mid*sc, n:nO+1};
}
function aiSetup(id){
  const ids=autoXI(id,"4-3-3");
  return {ids,form:"4-3-3"};
}

/* simulate a full match between two setups; if interactive, returns generator of minute events */
function simMatch(hId,aId,opts={}){
  const knockout=opts.knockout||false;
  const hSet=opts.hSet||aiSetup(hId), aSet=opts.aSet||aiSetup(aId);
  const hM=opts.hMent||MENT.bal, aM=opts.aMent||MENT.bal;
  const st={h:hId,a:aId,hs:0,as:0,min:0,evs:[],hSet,aSet,hM,aM,done:false,knockout,
            shots:{h:0,a:0},sot:{h:0,a:0},mom:50,subs:{h:0,a:0},pens:null,et:false};
  st.step=()=>minute(st);
  return st;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function wPick(ids,wfn){let t=0;const ws=ids.map(id=>{const w=wfn(G.players[id]);t+=w;return w;});let r=Math.random()*t;for(let i=0;i<ids.length;i++){r-=ws[i];if(r<=0)return ids[i];}return ids[ids.length-1];}
function outfield(set){const slots=FORMATIONS[set.form].slots;return set.ids.filter((id,i)=>id&&slots[i]!=="G");}

const GOAL_LINES=["slams it into the roof of the net","curls it into the far corner","taps in from close range","heads it home","finishes coolly past the keeper","thunders one in from distance","pokes it through the keeper's legs"];
const CHANCE_LINES=["forces a sharp save","drags a shot just wide","rattles the crossbar","sees the effort blocked at the last moment","heads over from six yards","is denied by a brilliant stop"];

function minute(st){
  if(st.done)return null;
  st.min++;
  const out=[];
  const sides=[["h","a",st.hSet,st.aSet,st.hM,st.aM],["a","h",st.aSet,st.hSet,st.aM,st.hM]];
  for(const [me,op,mySet,opSet,myM,opM] of sides){
    const A=teamStrength(st[me],mySet,myM), D=teamStrength(st[op],opSet,opM);
    const ratio=A.att/Math.max(40,D.def);
    const pChance=0.040*Math.pow(ratio,1.6)*(opM===MENT.atk?1.12:1);
    const ofd=outfield(mySet);
    if(Math.random()<pChance && ofd.length){
      st.shots[me]++; st.mom += (me==="h"?4:-4); st.mom=Math.max(8,Math.min(92,st.mom));
      const shooter=wPick(ofd,p=>p.pos==="F"?p.r*2.4:p.pos==="M"?p.r*1.1:p.r*0.25);
      const pl=G.players[shooter];
      const conv=0.30*Math.pow(ratio,0.45);
      if(Math.random()<conv){
        st[me+"s"]++; st.sot[me]++; pl.goals++;
        out.push({t:me==="h"?"goal":"goal-a",min:st.min,txt:"GOAL! "+pl.n+" "+pick(GOAL_LINES)+"! "+scoreline(st)});
      } else if(Math.random()<0.55){ st.sot[me]++; out.push({t:"info",min:st.min,txt:pl.n+" "+pick(CHANCE_LINES)+"."}); }
    }
    /* cards */
    if(Math.random()<0.012 && ofd.length){
      const pid=wPick(ofd,p=>p.pos==="D"?2:p.pos==="M"?1.4:0.7), pl=G.players[pid];
      pl.yc++;
      if(pl.yc>=2 && pl._ycThis){ /* second yellow this match */
        out.push({t:"redc",min:st.min,txt:"RED CARD! "+pl.n+" is sent off for a second booking."});
        removeFromSet(mySet,pid); pl.banned=1; pl._fresh=true; pl.yc=0;
      } else {
        pl._ycThis=true;
        out.push({t:"card",min:st.min,txt:"Yellow card for "+pl.n+"."});
        if(pl.yc>=2){pl.banned=1;pl._fresh=true;pl.yc=0; if(st.h===G.me||st.a===G.me) out.push({t:"info",min:st.min,txt:pl.n+" will be suspended for the next match (accumulated bookings)."});}
      }
    }
    if(Math.random()<0.0009 && outfield(mySet).length>7){
      const pid=pick(outfield(mySet)), pl=G.players[pid];
      out.push({t:"redc",min:st.min,txt:"RED CARD! "+pl.n+" is shown a straight red!"});
      removeFromSet(mySet,pid); pl.banned=1; pl._fresh=true;
    }
    /* injuries */
    if(Math.random()<0.0016 && outfield(mySet).length){
      const pid=pick(outfield(mySet)), pl=G.players[pid];
      pl.injured=1+Math.floor(Math.random()*3); pl._fresh=true;
      out.push({t:"redc",min:st.min,txt:"Injury: "+pl.n+" can't continue ("+pl.injured+" match"+(pl.injured>1?"es":"")+")."});
      removeFromSet(mySet,pid);
    }
    /* fatigue */
    mySet.ids.forEach(id=>{if(id){const p=G.players[id]; p.cond=Math.max(20,p.cond-(0.34+(myM===MENT.atk?0.06:0)));}});
  }
  st.mom += st.mom>50?-0.35:0.35;
  const FT=st.et?120:90;
  if(st.min>=FT){
    if(st.knockout && st.hs===st.as && !st.et){ st.et=true; out.push({t:"info",min:90,txt:"Full time, level. We're going to extra time."}); }
    else if(st.knockout && st.hs===st.as && st.et){ shootout(st,out); st.done=true; }
    else { st.done=true; out.push({t:"info",min:st.min,txt:"FULL TIME. "+scoreline(st)}); }
  } else if(st.min===45) out.push({t:"info",min:45,txt:"Half time. "+scoreline(st)});
  return out;
}
function removeFromSet(set,pid){const i=set.ids.indexOf(pid); if(i>=0)set.ids[i]=null;}
function scoreline(st){return TEAMS[st.h].n+" "+st.hs+"–"+st.as+" "+TEAMS[st.a].n;}
function shootout(st,out){
  const hS=teamStrength(st.h,st.hSet,MENT.bal), aS=teamStrength(st.a,st.aSet,MENT.bal);
  let h=0,a=0;
  for(let i=0;i<5;i++){ if(Math.random()<0.74+ (hS.att-aS.def)/2000) h++; if(Math.random()<0.74+(aS.att-hS.def)/2000) a++; }
  while(h===a){ if(Math.random()<0.74)h++; if(Math.random()<0.74)a++; }
  st.pens={h,a};
  out.push({t:h>a?"goal":"goal-a",min:120,txt:"Penalties: "+TEAMS[st.h].n+" "+h+"–"+a+" "+TEAMS[st.a].n+". "+TEAMS[h>a?st.h:st.a].n+" go through!"});
}
function runFull(st){while(!st.done)st.step(); finishMatch(st); return st;}
function winner(t){ const r=t.res||t; if(r.hs>r.as)return r.h; if(r.as>r.hs)return r.a; if(r.pens)return r.pens.h>r.pens.a?r.h:r.a; return null; }
function finishMatch(st){
  [[st.hSet],[st.aSet]].forEach(([s])=>s.ids.forEach(id=>{if(id)G.players[id].apps++;}));
  Object.values(G.players).forEach(p=>delete p._ycThis);
}
function recover(){
  Object.values(G.players).forEach(p=>{p.cond=Math.min(100,p.cond+34);});
}
function decrementBans(playedIds){
  /* reduce bans/injuries for teams that just played a matchday */
  Object.values(G.players).forEach(p=>{
    if(playedIds.has(p.team)){ if(p.banned>0)p.banned--; if(p.injured>0)p.injured--; }
  });
}

/* ---------------- group stage ---------------- */
function initStandings(){const s={};for(const g in GROUPS)GROUPS[g].forEach(id=>s[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return s;}
function groupFixtures(g,md){
  const [t1,t2,t3,t4]=GROUPS[g];
  if(md===0)return [[t1,t2],[t3,t4]];
  if(md===1)return [[t4,t2],[t1,t3]];
  return [[t4,t1],[t2,t3]];
}
function applyResult(h,a,hs,as){
  const H=G.standings[h],A=G.standings[a];
  H.p++;A.p++;H.gf+=hs;H.ga+=as;A.gf+=as;A.ga+=hs;
  if(hs>as){H.w++;A.l++;H.pts+=3;} else if(as>hs){A.w++;H.l++;A.pts+=3;} else {H.d++;A.d++;H.pts++;A.pts++;}
}
function sortGroup(g){
  return [...GROUPS[g]].sort((x,y)=>{const X=G.standings[x],Y=G.standings[y];
    return Y.pts-X.pts || (Y.gf-Y.ga)-(X.gf-X.ga) || Y.gf-X.gf || avgR(y)-avgR(x);});
}
function avgR(id){return TEAMS[id].sq.reduce((s,p)=>s+p[2],0)/TEAMS[id].sq.length;}
function buildBracket(){
  const winners=[],runners=[],thirds=[];
  for(const g in GROUPS){const o=sortGroup(g);winners.push(o[0]);runners.push(o[1]);thirds.push(o[2]);}
  const rank=id=>{const s=G.standings[id];return s.pts*100+(s.gf-s.ga)*5+s.gf+avgR(id)/100;};
  winners.sort((a,b)=>rank(b)-rank(a)); runners.sort((a,b)=>rank(b)-rank(a)); thirds.sort((a,b)=>rank(b)-rank(a));
  const q=[...winners,...runners,...thirds.slice(0,8)];
  const ties=[];
  for(let i=0;i<16;i++){let A=q[i],B=q[31-i];
    if(groupOf(A)===groupOf(B)){const j=31-i-1; if(j>15){[q[31-i],q[j]]=[q[j],q[31-i]];B=q[31-i];}}
    ties.push({h:A,a:B,res:null});
  }
  return {R32:ties,R16:[],QF:[],SF:[],F:[],TP:[]};
}
function pushNews(d,txt){G.news.unshift({d,txt});}

/* ---------------- UI ---------------- */
const app=document.getElementById("app");
let UI={screen:"select",tab:"overview",selXi:null,selBench:null,match:null,timer:null,speed:140,paused:false,subUsed:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stars(id){const a=avgR(id);const n=a>=84?5:a>=79?4:a>=74?3:a>=69?2:1;return "★".repeat(n)+"☆".repeat(5-n);}
function mast(){return `<div class="mast"><h1>Gaffer <span class="tick">'26</span></h1><div class="sub">FIFA World Cup 2026 · USA / Canada / Mexico · 48 teams</div></div>`;}

function render(){
  if(UI.screen==="select")return renderSelect();
  if(UI.screen==="hub")return renderHub();
  if(UI.screen==="match")return renderMatchShell();
  if(UI.screen==="over")return renderOver();
}

/* ----- team select ----- */
function renderSelect(){
  let g="";
  for(const k in GROUPS){
    g+=`<div class="gcard"><h3>Group ${k}</h3>`+GROUPS[k].map(id=>
      `<button class="team-row" onclick="startGame('${id}')"><span class="flag">${TEAMS[id].f}</span>${esc(TEAMS[id].n)}<span class="stars">${stars(id)}</span></button>`).join("")+`</div>`;
  }
  app.innerHTML=mast()+`

}
function startGame(id){newGame(id);UI.screen="hub";UI.tab="overview";render();}

/* ----- hub ----- */
function stageLabel(){
  if(G.stage<=2)return "Group "+groupOf(G.me)+" · Matchday "+(G.stage+1);
  return ["","","","Round of 32","Round of 16","Quarter-final","Semi-final","Final"][G.stage];
}
function myNextFixture(){
  if(!G.alive)return null;
  if(G.stage<=2){
    const fx=groupFixtures(groupOf(G.me),G.stage);
    return fx.find(f=>f.includes(G.me));
  }
  const r=["R32","R16","QF","SF","F"][G.stage-3];
  if(G.stage===7 && G.thirdMatch && !G.thirdMatch.res) {const t=G.thirdMatch; return [t.h,t.a];}
  const tie=G.bracket&&G.bracket[r]&&G.bracket[r].find(t=>(t.h===G.me||t.a===G.me)&&!t.res);
  return tie?[tie.h,tie.a]:null;
}
function renderHub(){
  const t=TEAMS[G.me], fx=myNextFixture();
  const opp=fx?(fx[0]===G.me?fx[1]:fx[0]):null;
  const tabs=["overview","squad","tactics","groups","bracket","scorers"];
  const tabNames={overview:"Dugout",squad:"Squad",tactics:"Tactics",groups:"Groups",bracket:"Bracket",scorers:"Golden Boot"};
  app.innerHTML=mast()+`
  <div class="hubhead">

    <div class="next"><div class="lbl">${G.alive&&fx?"Next match":"Status"}</div>
    <div class="fix">${G.alive&&fx?TEAMS[fx[0]].f+" "+esc(TEAMS[fx[0]].n)+" v "+esc(TEAMS[fx[1]].n)+" "+TEAMS[fx[1]].f:(G.champion===G.me?"World champions!":"Out of the tournament")}</div>
    ${G.alive&&fx?`<button class="btn primary" style="margin-top:8px" onclick="goMatch()">Play match</button>`:""}
    </div>
  </div>
  <div class="tabs">${tabs.map(x=>`<button class="tab ${UI.tab===x?"on":""}" onclick="UI.tab='${x}';render()">${tabNames[x]}</button>`).join("")}</div>

  <p class="footnote">Representative squads & editorial ratings — not the official FIFA 26-man lists. Simplified knockout seeding. Built as a one-file game; closing the tab ends the save.</p>`;
  const b=document.getElementById("tabbody");

function tabOverview(){

  </div>
  <div class="panel"><h3>Team news</h3>${G.news.slice(0,12).map(n=>`<div class="news-item"><div class="d">${esc(n.d)}</div>${esc(n.txt)}</div>`).join("")||"No news yet."}</div>`;

function statusBadge(p){

function tabSquad(){

function tabTactics(){
  setTimeout(drawPitch,0);
  return `<div class="selects">
    <select onchange="changeFormation(this.value)">${Object.keys(FORMATIONS).map(f=>`<option ${f===G.formation?"selected":""}>${f}</option>`).join("")}</select>
    <select onchange="G.mentality=this.value;render()"><option value="def" ${G.mentality==="def"?"selected":""}>Defensive</option><option value="bal" ${G.mentality==="bal"?"selected":""}>Balanced</option><option value="atk" ${G.mentality==="atk"?"selected":""}>Attacking</option></select>
    <button class="btn sm" onclick="G.xi=autoXI(G.me,G.formation);UI.selXi=null;render()">Auto-pick XI</button>
  </div>
  <div class="tactics-wrap">
    <div class="pitch" id="pitch"><div class="half"></div><div class="circle"></div></div>
    <div class="panel" style="margin:0"><h3>Bench & reserves</h3><div style="font-size:12px;color:var(--chalk-dim);margin-bottom:8px">Tap a shirt on the pitch, then a player here, to swap them in. Out-of-position picks take a rating hit.</div><div class="bench-list" id="bench"></div></div>
  </div>`;
}
function changeFormation(f){G.formation=f;G.xi=autoXI(G.me,f);UI.selXi=null;render();}
function drawPitch(){
  const pitch=document.getElementById("pitch"),bench=document.getElementById("bench");
  if(!pitch)return;
  const F=FORMATIONS[G.formation];
  pitch.querySelectorAll(".chip").forEach(c=>c.remove());
  G.xi.forEach((pid,i)=>{
    const [x,y]=F.xy[i];
    const c=document.createElement("button");c.className="chip"+(UI.selXi===i?" sel":"");
    const p=pid?G.players[pid]:null;
    if(p&&p.cond<55)c.classList.add("low");
    c.style.left=x+"%";c.style.top=y+"%";
    c.innerHTML=`<span class="dot">${p?Math.round(eff(p,F.slots[i])):"—"}</span><span class="nm">${p?esc(shortName(p.n)):F.slots[i]}</span>`;
    c.onclick=()=>{UI.selXi=UI.selXi===i?null:i;drawPitch();};
    pitch.appendChild(c);
  });
  const inXi=new Set(G.xi);
  const pool=teamPlayers(G.me).filter(p=>!inXi.has(p.id)).sort((a,b)=>"GDMF".indexOf(a.pos)-"GDMF".indexOf(b.pos)||b.r-a.r);
  bench.innerHTML=pool.map(p=>`<button class="bench-row" ${!available(p)?"disabled style='opacity:.4'":""} onclick="benchPick('${p.id}')"><span class="pos-${p.pos} mono" style="width:16px">${p.pos}</span>${esc(p.n)}${statusBadge(p)}<span class="r">${p.r} · ${Math.round(p.cond)}%</span></button>`).join("");
}
function shortName(n){const parts=n.split(" ");return parts.length>1?parts.slice(1).join(" "):n;}
function benchPick(pid){
  if(UI.selXi===null)return;
  const p=G.players[pid]; if(!available(p))return;
  const slot=FORMATIONS[G.formation].slots[UI.selXi];
  if((slot==="G")!==(p.pos==="G"))return;
  G.xi[UI.selXi]=pid;UI.selXi=null;drawPitch();
}
function tabGroups(){
  let h="";
  for(const g in GROUPS){
    const o=sortGroup(g);
    h+=`<div class="panel"><h3>Group ${g}</h3><table><tr><th></th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GD</th><th class="num">Pts</th></tr>
    ${o.map((id,i)=>{const s=G.standings[id];return `<tr class="${id===G.me?"me":""} ${i<2?"qual":""}"><td class="num">${i+1}</td><td>${TEAMS[id].f} ${esc(TEAMS[id].n)}</td><td class="num">${s.p}</td><td class="num">${s.w}</td><td class="num">${s.d}</td><td class="num">${s.l}</td><td class="num">${s.gf-s.ga>0?"+":""}${s.gf-s.ga}</td><td class="num"><b>${s.pts}</b></td></tr>`;}).join("")}
    </table></div>`;
  }
  return `<p style="color:var(--chalk-dim);font-size:13px;margin-bottom:12px">Top two qualify automatically; the eight best third-placed teams also reach the Round of 32.</p><div class="groups-grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${h}</div>`;
}
function tieHTML(t,roundDone){
  if(!t)return "";
  const w=t.res?winner(t.res):null;
  const cls=(t.h===G.me||t.a===G.me)?"tie metie":"tie";
  const row=(id,sc,isW)=>`<div class="tm ${t.res?(isW?"win":"lose"):""}"><span>${TEAMS[id].f}</span><span>${esc(TEAMS[id].n)}</span><span class="sc">${sc}</span></div>`;
  const hsc=t.res?t.res.hs+(t.res.pens?" ("+t.res.pens.h+")":""):"";
  const asc=t.res?t.res.as+(t.res.pens?" ("+t.res.pens.a+")":""):"";
  return `<div class="${cls}">${row(t.h,hsc,w===t.h)}${row(t.a,asc,w===t.a)}</div>`;
}
function tabBracket(){
  if(!G.bracket)return `<div class="panel"><h3>Knockout bracket</h3><p style="color:var(--chalk-dim)">The bracket forms once the group stage is complete. 32 teams make it: 12 winners, 12 runners-up and the 8 best third-placed sides.</p></div>`;
  const B=G.bracket;
  const col=(nm,arr)=>`<div class="round"><h4>${nm}</h4>${arr.map(t=>tieHTML(t)).join("")||'<div style="color:var(--chalk-dim);font-size:12px">TBD</div>'}</div>`;
  return `<div class="bracket">${col("Round of 32",B.R32)}${col("Round of 16",B.R16)}${col("Quarter-finals",B.QF)}${col("Semi-finals",B.SF)}${col("Final",B.F)}${B.TP.length?col("Third place",B.TP):""}</div>
  ${G.champion?`<div class="panel" style="margin-top:14px;text-align:center"><h3 style="margin-bottom:4px">🏆 ${TEAMS[G.champion].f} ${esc(TEAMS[G.champion].n)} are world champions</h3></div>`:""}`;
}
function tabScorers(){
  const top=Object.values(G.players).filter(p=>p.goals>0).sort((a,b)=>b.goals-a.goals||b.r-a.r).slice(0,15);
  return `<div class="panel"><h3>Golden Boot race</h3>${top.length?`<table><tr><th>Player</th><th>Nation</th><th class="num">Goals</th></tr>${top.map(p=>`<tr ${p.team===G.me?'class="me"':""}><td>${esc(p.n)}</td><td>${TEAMS[p.team].f} ${esc(TEAMS[p.team].n)}</td><td class="num"><b>${p.goals}</b></td></tr>`).join("")}</table>`:"No goals yet — the tournament is young."}</div>`;
}

/* ---------------- match day ---------------- */
function validateXI(){
  /* auto-replace unavailable players before kickoff */
  const F=FORMATIONS[G.formation];
  let changed=[];
  G.xi.forEach((pid,i)=>{
    const p=pid?G.players[pid]:null;
    if(!p||!available(p)){
      const inXi=new Set(G.xi);
      const slot=F.slots[i];
      const cand=teamPlayers(G.me).filter(q=>available(q)&&!inXi.has(q.id)&&((slot==="G")===(q.pos==="G")))
        .sort((a,b)=>eff(b,slot)+(b.pos===slot?4:0)-eff(a,slot)-(a.pos===slot?4:0))[0];
      if(cand){G.xi[i]=cand.id;if(p)changed.push(p.n+" → "+cand.n);}
    }
  });
  if(changed.length)pushNews("Enforced changes","Unavailable players replaced: "+changed.join(", ")+".");
}
function goMatch(){
  validateXI();
  const fx=myNextFixture(); if(!fx)return;
  const iAmHome=fx[0]===G.me;
  const mySet={ids:[...G.xi],form:G.formation};
  const knockout=G.stage>=3;
  const opts=knockout?{knockout:true}:{};
  if(iAmHome){opts.hSet=mySet;opts.hMent=MENT[G.mentality];}
  else{opts.aSet=mySet;opts.aMent=MENT[G.mentality];}
  UI.match=simMatch(fx[0],fx[1],opts);
  UI.match.iAmHome=iAmHome;
  UI.subUsed=new Set(G.xi);
  UI.paused=true;UI.started=false;UI.speed=140;UI.selXi=null;UI.subMode=false;
  UI.screen="match";render();
}
function mySet(){return UI.match.iAmHome?UI.match.hSet:UI.match.aSet;}
function renderMatchShell(){
  const m=UI.match,h=TEAMS[m.h],a=TEAMS[m.a];
  app.innerHTML=mast()+`
  <div class="scoreboard">
    <div class="side"><span class="flag">${h.f}</span><span class="nm">${esc(h.n)}</span></div>
    <div><div class="scoreline" id="sc">${m.hs} – ${m.as}</div><div class="clockrow" id="clock">${UI.started?m.min+"'":stageLabel().toUpperCase()}</div></div>
    <div class="side away"><span class="nm">${esc(a.n)}</span><span class="flag">${a.f}</span></div>
  </div>
  <div class="momentum"><div class="h" id="momh" style="width:50%"></div><div class="a" id="moma" style="width:50%"></div></div>
  <div class="matchctl" id="ctl"></div>
  <div id="subpanel"></div>
  <div class="feed" id="feed"></div>
  <div class="statgrid" id="stats"></div>
  <div class="othergames" id="others"></div>`;
  renderCtl();updateStats();
  feedMsg({t:"info",min:0,txt:UI.match.knockout?"Knockout football — win or go home. Extra time and penalties if needed.":"Three points up for grabs. Good luck, gaffer."});
}
function renderCtl(){
  const c=document.getElementById("ctl");if(!c)return;
  const m=UI.match;
  if(m.done){
    c.innerHTML=`<button class="btn primary" onclick="afterMyMatch()">Continue</button>`;
    return;
  }
  c.innerHTML=`
   ${!UI.started?`<button class="btn primary" onclick="startSim()">Kick off</button>`:
     UI.paused?`<button class="btn primary" onclick="resumeSim()">${m.min===45?"Start second half":"Resume"}</button>`:
     `<button class="btn" onclick="pauseSim()">Pause</button>`}
   <button class="btn sm ${UI.speed===140?"gold":""}" onclick="setSpeed(140)">1×</button>
   <button class="btn sm ${UI.speed===60?"gold":""}" onclick="setSpeed(60)">2×</button>
   <button class="btn sm ${UI.speed===22?"gold":""}" onclick="setSpeed(22)">4×</button>
   ${UI.started?`<button class="btn sm" ${UI.paused?"":"disabled"} onclick="toggleSubs()">Changes (${5-m.subs[UI.match.iAmHome?"h":"a"]} subs left)</button>
   <select onchange="myMentSet(this.value)" ${UI.paused?"":"disabled"}>
     <option value="def" ${G.mentality==="def"?"selected":""}>Defensive</option>
     <option value="bal" ${G.mentality==="bal"?"selected":""}>Balanced</option>
     <option value="atk" ${G.mentality==="atk"?"selected":""}>Attacking</option></select>`:""}`;
}
function myMentSet(v){G.mentality=v;const M=MENT[v];if(UI.match.iAmHome)UI.match.hM=M;else UI.match.aM=M;feedMsg({t:"info",min:UI.match.min,txt:"Mentality switched to "+M.nm+"."});}
function setSpeed(s){UI.speed=s;if(!UI.paused&&UI.started){clearInterval(UI.timer);UI.timer=setInterval(tick,UI.speed);}renderCtl();}
function startSim(){UI.started=true;resumeSim();}
function resumeSim(){UI.paused=false;UI.subMode=false;document.getElementById("subpanel").innerHTML="";clearInterval(UI.timer);UI.timer=setInterval(tick,UI.speed);renderCtl();}
function pauseSim(){UI.paused=true;clearInterval(UI.timer);renderCtl();}
function tick(){
  const m=UI.match;
  const evs=m.step();
  (evs||[]).forEach(feedMsg);
  document.getElementById("sc").textContent=m.hs+" – "+m.as+(m.pens?"  ("+m.pens.h+"–"+m.pens.a+" pens)":"");
  document.getElementById("clock").textContent=m.min+"'"+(m.et?" AET":"");
  document.getElementById("momh").style.width=m.mom+"%";
  document.getElementById("moma").style.width=(100-m.mom)+"%";
  updateStats();
  if(m.min===45&&!m.done){pauseSim();}
  if(m.done){clearInterval(UI.timer);finishMatch(m);renderCtl();}
}
function updateStats(){
  const m=UI.match,s=document.getElementById("stats");if(!s)return;
  s.innerHTML=`<div class="l">${m.shots.h}</div><div class="c">Shots</div><div>${m.shots.a}</div>
  <div class="l">${m.sot.h}</div><div class="c">On target</div><div>${m.sot.a}</div>`;
}
function feedMsg(ev){
  const f=document.getElementById("feed");if(!f)return;
  const d=document.createElement("div");d.className="ev "+(ev.t||"");
  d.innerHTML=`<span class="min">${ev.min}'</span><span>${esc(ev.txt)}</span>`;
  f.prepend(d);
}
function toggleSubs(){
  UI.subMode=!UI.subMode;UI.selXi=null;
  renderSubPanel();
}
function renderSubPanel(){
  const sp=document.getElementById("subpanel");if(!sp)return;
  if(!UI.subMode){sp.innerHTML="";return;}
  const m=UI.match,set=mySet(),F=FORMATIONS[set.form];
  const sideKey=m.iAmHome?"h":"a";
  if(m.subs[sideKey]>=5){sp.innerHTML=`<div class="panel">No substitutions left.</div>`;return;}
  const onPitch=set.ids.map((pid,i)=>pid?`<button class="bench-row ${UI.selXi===i?"sel":""}" onclick="pickOff(${i})"><span class="mono pos-${F.slots[i]}" style="width:16px">${F.slots[i]}</span>${esc(G.players[pid].n)}<span class="r">${Math.round(G.players[pid].cond)}%</span></button>`:"").join("");
  const inUse=new Set([...UI.subUsed,...set.ids.filter(Boolean)]);
  const bench=teamPlayers(G.me).filter(p=>available(p)&&!inUse.has(p.id))
    .map(p=>`<button class="bench-row" onclick="pickOn('${p.id}')"><span class="mono pos-${p.pos}" style="width:16px">${p.pos}</span>${esc(p.n)}<span class="r">${p.r} · ${Math.round(p.cond)}%</span></button>`).join("");
  sp.innerHTML=`<div class="panel"><h3>Make a change</h3><p style="font-size:12px;color:var(--chalk-dim);margin:0 0 8px">${UI.selXi===null?"Pick who comes off, then who comes on.":"Now pick a replacement."}</p><div class="tactics-wrap"><div><div style="font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Coming off</div>${onPitch}</div><div><div style="font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Coming on</div><div class="bench-list" style="max-height:260px">${bench||"Nobody fit on the bench."}</div></div></div></div>`;
}
function pickOff(i){UI.selXi=i;renderSubPanel();}
function pickOn(pid){
  if(UI.selXi===null)return;
  const m=UI.match,set=mySet(),F=FORMATIONS[set.form];
  const slot=F.slots[UI.selXi];
  const p=G.players[pid];
  if((slot==="G")!==(p.pos==="G")){feedMsg({t:"info",min:m.min,txt:"You can only swap a goalkeeper for a goalkeeper."});return;}
  const off=set.ids[UI.selXi];
  set.ids[UI.selXi]=pid;UI.subUsed.add(pid);
  m.subs[m.iAmHome?"h":"a"]++;
  p.apps++;
  feedMsg({t:"info",min:m.min,txt:"Substitution: "+p.n+" replaces "+(off?G.players[off].n:"the gap in the line-up")+"."});
  UI.selXi=null;UI.subMode=false;document.getElementById("subpanel").innerHTML="";renderCtl();
}

/* ---------------- tournament progression ---------------- */
function afterMyMatch(){
  const m=UI.match;
  UI.screen="hub";UI.tab="overview";
  const others=[];
  if(G.stage<=2){
    applyResult(m.h,m.a,m.hs,m.as);
    for(const g in GROUPS){
      for(const [h,a] of groupFixtures(g,G.stage)){
        if(h===m.h&&a===m.a)continue;
        const r=runFull(simMatch(h,a));
        applyResult(h,a,r.hs,r.as);
        others.push(r);
      }
    }
    G.results["md"+G.stage]=[m,...others];
    pushNews("Matchday "+(G.stage+1)+" — Group "+groupOf(G.me),resultText(m));
    endOfRoundHousekeeping();
    G.stage++;
    if(G.stage===3)settleGroups();
  } else {
    settleKnockoutRound(m);
  }
  render();
}
function resultText(r){return TEAMS[r.h].n+" "+r.hs+(r.pens?" ("+r.pens.h+")":"")+" – "+r.as+(r.pens?" ("+r.pens.a+")":"")+" "+TEAMS[r.a].n;}
function endOfRoundHousekeeping(){
  Object.values(G.players).forEach(p=>{
    if(p._fresh){delete p._fresh;return;}
    if(p.banned>0)p.banned--;
    if(p.injured>0)p.injured--;
  });
  recover();
}
function settleGroups(){
  G.bracket=buildBracket();
  const inB=new Set(G.bracket.R32.flatMap(t=>[t.h,t.a]));
  if(!inB.has(G.me)){
    G.alive=false;
    const pos=sortGroup(groupOf(G.me)).indexOf(G.me)+1;
    pushNews("Group stage over","You finished "+pos+ordinal(pos)+" in Group "+groupOf(G.me)+" — not enough to reach the Round of 32.");
    UI.screen="over";return;
  }
  pushNews("Knockout draw","You're through to the Round of 32. "+r32OppText());
}
function r32OppText(){const t=G.bracket.R32.find(t=>t.h===G.me||t.a===G.me);const o=t.h===G.me?t.a:t.h;return "You'll face "+TEAMS[o].n+".";}
function ordinal(n){return n===1?"st":n===2?"nd":n===3?"rd":"th";}
function roundKey(){return ["R32","R16","QF","SF","F"][G.stage-3];}
function settleKnockoutRound(myResult){
  const key=roundKey(), ties=G.bracket&&G.bracket[key];
  if(!ties||!ties.length){UI.screen="over";return;}
  /* third-place match handling */
  if(G.stage===7&&G.thirdMatch&&!G.thirdMatch.res&&(myResult.h===G.thirdMatch.h)){
    G.thirdMatch.res=myResult;
    pushNews("Third-place play-off",resultText(myResult));
    finishTournamentSim();
    G.alive=false;UI.screen="over";return;
  }
  for(const t of ties){
    if(!t.res){
      if((t.h===myResult.h&&t.a===myResult.a)) t.res=myResult;
      else t.res=runFull(simMatch(t.h,t.a,{knockout:true}));
    }
  }
  pushNews(["Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"][G.stage-3],resultText(myResult));
  const winners=ties.map(winner);
  endOfRoundHousekeeping();
  const iWon=winners.includes(G.me);
  if(key==="F"){
    G.champion=winners[0];
    if(iWon){G.alive=true;UI.screen="over";return;}
  }
  if(!iWon&&key!=="F"){
    G.alive=false;
    if(key==="SF"){
      const loser=myResult.h===G.me||myResult.a===G.me?(winner(myResult)===myResult.h?myResult.a:myResult.h):null;
      const otherLoser=ties.map(t=>winner(t)===t.h?t.a:t.h).find(x=>x!==loser);
      G.thirdMatch={h:loser,a:otherLoser,res:null};
      G.alive=true; /* one more match to play */
      pushNews("Semi-final heartbreak","So close. The third-place play-off against "+TEAMS[otherLoser].n+" is your final match.");
      G.stage=7;nextRoundTies(winners,key);UI.screen="hub";render();return;
    }
    pushNews("Knocked out","Your World Cup ends here.");
    nextRoundTies(winners,key);
    finishTournamentSim();
    UI.screen="over";return;
  }
  nextRoundTies(winners,key);
  G.stage++;
  if(key==="F")UI.screen="over";
}
function nextRoundTies(winners,key){
  const nextKey={R32:"R16",R16:"QF",QF:"SF",SF:"F"}[key];
  if(!nextKey)return;
  const next=[];
  for(let i=0;i<winners.length;i+=2)next.push({h:winners[i],a:winners[i+1],res:null});
  G.bracket[nextKey]=next;
}
function finishTournamentSim(){
  /* simulate any remaining rounds so the bracket completes */
  if(!G.bracket){G.bracket=buildBracket();}
  const order=["R32","R16","QF","SF","F"];
  for(const k of order){
    const ties=G.bracket[k];
    if(!ties||!ties.length){ if(k==="R16"||k==="QF"||k==="SF"||k==="F"){const prev=order[order.indexOf(k)-1];const w=G.bracket[prev].map(winner);nextRoundTies(w,prev);} }
    for(const t of G.bracket[k]){ if(!t.res)t.res=runFull(simMatch(t.h,t.a,{knockout:true})); }
  }
  const f=G.bracket.F[0];
  G.champion=winner(f);
  if(G.thirdMatch&&!G.thirdMatch.res)G.thirdMatch.res=runFull(simMatch(G.thirdMatch.h,G.thirdMatch.a,{knockout:true}));
  if(G.thirdMatch)G.bracket.TP=[G.thirdMatch];
}
function renderOver(){
  const won=G.champion===G.me;
  if(!G.champion&&!G.alive)finishTournamentSim();
  const champ=G.champion;
  app.innerHTML=mast()+`<div class="bigmoment">
    <div class="tr">${won?"🏆":"📋"}</div>
    <h2>${won?TEAMS[G.me].n+" are champions of the world":"Your tournament is over"}</h2>
    <p>${won?"July 19, MetLife Stadium. "+TEAMS[G.me].n+" lift the 2026 World Cup. They'll sing about this one for generations — and it was your team sheet that did it.":
      (champ?TEAMS[champ].f+" "+TEAMS[champ].n+" went on to lift the trophy. Different shape next time, gaffer?":"")}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="UI.screen='hub';UI.tab='bracket';render()">View final bracket</button>
      <button class="btn" onclick="UI.screen='hub';UI.tab='scorers';render()">Golden Boot</button>
      <button class="btn primary" onclick="UI.screen='select';render()">Start a new save</button>
    </div></div>`;
}

render();
</script>
</body>
</html>
